[package]
name = "pachakutech-presence-daemon"
version = "0.1.0"
edition = "2021"
description = "Native Presence Daemon: owns the GPU. Talks to the MCP Binding over a local Unix socket."
license = "MIT"

[dependencies]
# `loaded` (default) feature dynamically loads libvulkan.so at runtime via
# libloading — this crate compiles fine on a machine with no Vulkan SDK
# installed, and only fails, with a clear error, when actually run on one
# with no driver present. That's the right failure mode for something meant
# to be built and reviewed on machines that don't all have a GPU handy.
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same "dlopen at runtime, don't link at build time" pattern as `ash`
# above — these compile on any machine, including this one with no
# compositor or camera, and only fail (with a clear error) when actually
# run on a machine missing the relevant library/device.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
# V4L2 needs no client library at all — it's raw ioctl(2) calls against a
# /dev/videoN file descriptor — so the webcam backend is hand-written
# against `libc` directly rather than pulling in the `v4l` crate, whose
# `v4l2-sys` binding generator needs libclang (not installable in this
# sandbox, and an unnecessary build dependency for something this small).
libc = "0.2"
# GBM is dlopen'd at runtime for dmabuf allocation in the screencopy-dmabuf
# capture path — same pattern as ash/wayland-client. Avoids the `gbm` crate's
# build-time dependency on libclang (via drm-ffi/bindgen).
libloading = "0.8"

[dev-dependencies]
# Used only in tests, to assert real struct field offsets (`offset_of!`)
# against hand-computed std140/std430 layout math, the same rigor as the
# V4L2 ABI checks in ingress/webcam_v4l2.rs.
memoffset = "0.9"

[[bin]]
name = "presence-daemon"
path = "src/main.rs"
